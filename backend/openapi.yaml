openapi: 3.0.0
info:
  title: Infrastructure Portal API
  description: API for creating infrastructure requests and managing PRs
  version: 1.0.0
  contact:
    name: Infrastructure Portal
    email: support@example.com

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://34.30.10.133:8080
    description: EC2 production server

paths:
  /create-pr:
    post:
      summary: Create a new infrastructure request PR
      description: Creates a new infrastructure request, saves it to GitHub as a PR, and stores it in the database
      operationId: createPR
      tags:
        - Infrastructure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - team
                - env
                - cloud
                - service
              properties:
                team:
                  type: string
                  description: Team identifier
                  example: "3656"
                env:
                  type: string
                  description: Environment (dev, stage, prod)
                  example: "dev"
                cloud:
                  type: string
                  description: Cloud provider (aws, gcp, azure)
                  example: "gcp"
                service:
                  type: string
                  description: Service name
                  example: "compute-engine"
                config:
                  type: object
                  description: Additional configuration parameters
                  additionalProperties: true
      responses:
        '200':
          description: PR created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  pr_url:
                    type: string
                    format: uri
                    example: "https://github.com/owner/repo/pull/123"
                  status:
                    type: string
                    example: "created"
                  branch:
                    type: string
                    example: "3656/dev"
                  file_path:
                    type: string
                    example: "3656/envs/dev/request.json"
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "missing required field: team"
                  status:
                    type: string
                    example: "error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to create PR: ..."
                  status:
                    type: string
                    example: "error"
      security: []

  /history:
    get:
      summary: Get request history
      description: Retrieves the history of infrastructure requests with optional filtering
      operationId: getHistory
      tags:
        - History
      parameters:
        - name: team
          in: query
          description: Filter by team identifier
          required: false
          schema:
            type: string
            example: "3656"
        - name: env
          in: query
          description: Filter by environment
          required: false
          schema:
            type: string
            example: "dev"
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: History retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  count:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        team:
                          type: string
                          example: "3656"
                        env:
                          type: string
                          example: "dev"
                        cloud:
                          type: string
                          example: "gcp"
                        service:
                          type: string
                          example: "compute-engine"
                        payload:
                          type: string
                          description: JSON string of the original request
                        pr_url:
                          type: string
                          format: uri
                          nullable: true
                          example: "https://github.com/owner/repo/pull/123"
                        branch:
                          type: string
                          example: "3656/dev"
                        file_path:
                          type: string
                          example: "3656/envs/dev/request.json"
                        status:
                          type: string
                          enum: [pending, pr_created]
                          example: "pr_created"
                        created_at:
                          type: string
                          format: date-time
                          example: "2026-01-27T10:00:00Z"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2026-01-27T10:00:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to get history: ..."
                  status:
                    type: string
                    example: "error"
      security: []

  /health:
    get:
      summary: Health check
      description: Returns the health status of the API
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
