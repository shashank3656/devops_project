name: Quality Gates
description: Run quality checks (Node, Go, Snyk, optional Sonar validation)

inputs:
  SNYK_TOKEN:
    description: Snyk token
    required: false

runs:
  using: "composite"
  steps:
    # -------------------------
    # ✅ Setup runtimes
    # -------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25"
        cache-dependency-path: backend/go.sum

    # -------------------------
    # ✅ Install dependencies
    # -------------------------
    - name: Install user portal dependencies
      shell: bash
      working-directory: ./frontend
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit --no-fund
        fi

    - name: Install admin portal dependencies
      shell: bash
      working-directory: ./admin-frontend
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit --no-fund
        fi

    - name: Install DevOps portal dependencies
      shell: bash
      working-directory: ./devops-frontend
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit --no-fund
        fi

    - name: Download Go modules
      shell: bash
      working-directory: ./backend
      run: go mod download

    # -------------------------
    # 🚫 Sonar (still optional - enable if needed)
    # -------------------------
    # - name: Run SonarQube scan
    #   uses: SonarSource/sonarqube-scan-action@v6
    #   with:
    #     args: >
    #       -Dproject.settings=.github/action/sonar-project.properties
    #   env:
    #     SONAR_TOKEN: ${{ inputs.SONAR_TOKEN }}
    #     SONAR_HOST_URL: ${{ inputs.SONAR_HOST_URL }}

    # -------------------------
    # ✅ Snyk
    # -------------------------
    - name: Install Snyk CLI
      if: ${{ inputs.SNYK_TOKEN != '' }}
      shell: bash
      run: npm install --global snyk

    - name: Run Snyk dependency scan
      if: ${{ inputs.SNYK_TOKEN != '' }}
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.SNYK_TOKEN }}
      run: snyk test --all-projects --detection-depth=4 --severity-threshold=high

    - name: Skip optional Snyk scan
      if: ${{ inputs.SNYK_TOKEN == '' }}
      shell: bash
      run: echo "Snyk token not configured; skipping optional dependency scan."