name: Deploy Reusable

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      public_api_url:
        required: true
        type: string
      backend_api_url:
        required: false
        type: string
        default: ""
      request_id:
        required: false
        type: string
        default: ""
      application_id:
        required: false
        type: string
        default: ""
      completion_status:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
      publish_latest:
        description: Push the environment-latest tag (skip on pull requests)
        required: false
        type: boolean
        default: true
      fail_on_trivy:
        description: Fail the job when Trivy finds issues
        required: false
        type: boolean
        default: true
      pr_number:
        required: false
        type: string
        default: ""
      enable_railway_image_updater:
        description: After push, call Railway Image Updater to retag all matching GHCR services (requires repo vars)
        required: false
        type: boolean
        default: false
      railway_environment_id:
        description: Railway environment UUID for image updater (falls back to RAILWAY_ENVIRONMENT_ID var)
        required: false
        type: string
        default: ""
      railway_project_id:
        description: Railway project UUID (falls back to RAILWAY_PROJECT_ID repo variable)
        required: false
        type: string
        default: ""
      ghcr_repo_name:
        description: GHCR image repo segment (ghcr.io/owner/NAME-backend). Defaults to GitHub repository name.
        required: false
        type: string
        default: ""
      railway_image_updater_url:
        description: Optional railway-image-updater service URL (PUT /update). If empty, uses RAILWAY_TOKEN.
        required: false
        type: string
        default: ""
    secrets:
      SNYK_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      CI_WEBHOOK_SECRET:
        required: false
      RAILWAY_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HAS_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
  NEXT_PUBLIC_API_URL: ${{ inputs.public_api_url }}
  BACKEND_API_URL: ${{ inputs.backend_api_url }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run quality gates
        uses: ./.github/actions/quality-gates-reusable
        with:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-and-push:
    name: Build, Scan, and Push Images
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
            image_suffix: backend
            needs_api_url: false
          - service: devops-frontend
            context: .
            dockerfile: ./devops-frontend/Dockerfile
            image_suffix: devops-frontend
            needs_api_url: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image-meta
        shell: bash
        env:
          GHCR_REPO_NAME: ${{ inputs.ghcr_repo_name }}
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "${GHCR_REPO_NAME}" ]; then
            repo="$(echo "${GHCR_REPO_NAME}" | tr '[:upper:]' '[:lower:]')"
          fi
          image_uri="${{ env.REGISTRY }}/${owner}/${repo}-${{ matrix.image_suffix }}"
          latest_tag="${{ inputs.environment_name }}-latest"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pr_tag=pr-${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Slack notification payloads
        id: notify-meta
        shell: bash
        env:
          SERVICE_NAME: ${{ matrix.service }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          IMAGE_URI: ${{ steps.image-meta.outputs.image_uri }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          NEEDS_API_URL: ${{ matrix.needs_api_url }}
          PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          SHA_VALUE: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          env_name = os.environ["ENVIRONMENT_NAME"]
          service = os.environ["SERVICE_NAME"]
          image = f'{os.environ["IMAGE_URI"]}:{os.environ["IMAGE_TAG"]}'
          release_notes = os.environ.get("RELEASE_NOTES", "").strip() or "Not provided"
          ref_name = os.environ.get("HEAD_REF", "").strip() or os.environ.get("REF_NAME", "").strip()
          short_sha = os.environ["SHA_VALUE"][:7]
          run_url = f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}'
          public_api_url = os.environ.get("PUBLIC_API_URL", "").strip() if os.environ.get("NEEDS_API_URL") == "true" else "not-required"

          def build_payload(color: str, title: str) -> dict:
              fields = [
                  {"type": "mrkdwn", "text": f"*Environment:*\n{env_name}"},
                  {"type": "mrkdwn", "text": f"*Service:*\n{service}"},
                  {"type": "mrkdwn", "text": f"*Repository:*\n{os.environ['REPOSITORY']}"},
                  {"type": "mrkdwn", "text": f"*Triggered by:*\n{os.environ['ACTOR']}"},
                  {"type": "mrkdwn", "text": f"*Ref:*\n{ref_name}"},
                  {"type": "mrkdwn", "text": f"*Commit:*\n{short_sha}"},
                  {"type": "mrkdwn", "text": f"*Image:*\n{image}"},
                  {"type": "mrkdwn", "text": f"*NEXT_PUBLIC_API_URL:*\n{public_api_url}"},
              ]
              return {
                  "attachments": [
                      {
                          "color": color,
                          "blocks": [
                              {
                                  "type": "header",
                                  "text": {"type": "plain_text", "text": title},
                              },
                              {
                                  "type": "section",
                                  "fields": fields,
                              },
                              {
                                  "type": "section",
                                  "text": {
                                      "type": "mrkdwn",
                                      "text": f"*Release notes:*\n{release_notes}",
                                  },
                              },
                              {
                                  "type": "context",
                                  "elements": [
                                      {
                                          "type": "mrkdwn",
                                          "text": f'Workflow: {os.environ["WORKFLOW_NAME"]} | Run #{os.environ["RUN_NUMBER"]}',
                                      }
                                  ],
                              },
                              {
                                  "type": "actions",
                                  "elements": [
                                      {
                                          "type": "button",
                                          "text": {"type": "plain_text", "text": "Open workflow run"},
                                          "url": run_url,
                                      }
                                  ],
                              },
                          ],
                      }
                  ]
              }

          success_payload = build_payload("#16a34a", f"Deploy succeeded - {env_name} - {service}")
          failure_payload = build_payload("#dc2626", f"Deploy failed - {env_name} - {service}")

          print("success_payload<<__JSON__")
          print(json.dumps(success_payload))
          print("__JSON__")
          print("failure_payload<<__JSON__")
          print(json.dumps(failure_payload))
          print("__JSON__")
          PY

      - name: Validate public API URL
        if: matrix.needs_api_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::warning::NEXT_PUBLIC_API_URL is not set; using https://backend-api-production-ed.up.railway.app for this image build"
            echo "NEXT_PUBLIC_API_URL=https://backend-api-production-ed.up.railway.app" >> "$GITHUB_ENV"
          fi

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.needs_api_url && format('NEXT_PUBLIC_API_URL={0}', env.NEXT_PUBLIC_API_URL) || '' }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln"
          timeout: "10m"

      - name: Show Trivy findings
        if: always()
        shell: bash
        env:
          FAIL_ON_TRIVY: ${{ inputs.fail_on_trivy }}
          IMAGE_REF: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          REPORT=trivy-results.json
          if [ ! -s "$REPORT" ]; then
            echo "::error::Trivy did not produce $REPORT"
            echo "## Trivy security summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`trivy-results.json\` was produced for \`$IMAGE_REF\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$REPORT")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$REPORT")
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "$REPORT")
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' "$REPORT")
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))

          if [ "$CRITICAL" -gt 0 ]; then
            STATUS="Failed (CRITICAL findings)"
          elif [ "$HIGH" -gt 0 ]; then
            STATUS="Reported (HIGH findings; does not fail PR builds)"
          elif [ "$TOTAL" -gt 0 ]; then
            STATUS="Passed with MEDIUM/LOW findings"
          else
            STATUS="Passed (no unfixed vulnerabilities)"
          fi

          echo "Trivy counts for $IMAGE_REF"
          echo "  CRITICAL=$CRITICAL HIGH=$HIGH MEDIUM=$MEDIUM LOW=$LOW TOTAL=$TOTAL"
          echo "  Status: $STATUS"

          echo "## 🔐 Trivy Security Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📦 Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 CRITICAL | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟠 HIGH | $HIGH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 MEDIUM | $MEDIUM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔵 LOW | $LOW |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Total** | **$TOTAL** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Status" >> "$GITHUB_STEP_SUMMARY"
          echo "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Findings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | ID | Package | Installed | Fixed | Title |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|----|---------|-----------|-------|-------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL" -eq 0 ]; then
            echo "| - | none | - | - | - | No unfixed vulnerabilities |" >> "$GITHUB_STEP_SUMMARY"
          else
            jq -r '.Results[]?.Vulnerabilities[]? | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "-"), ((.Title // "-") | gsub("\\|"; "/"))] | @tsv' "$REPORT" \
              | awk -F '\t' 'BEGIN { n=0 } n<80 { gsub(/\|/, "/", $0); printf "| %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6; n++ }' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Full Trivy table</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if command -v trivy >/dev/null 2>&1; then
            trivy convert --format table "$REPORT" >> "$GITHUB_STEP_SUMMARY" || true
          else
            jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion // "-")\t\(.Title // "-")"' "$REPORT" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Trivy table ($IMAGE_REF)"
          if command -v trivy >/dev/null 2>&1; then
            trivy convert --format table "$REPORT" || true
          else
            jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion // "-")\t\(.Title // "-")"' "$REPORT" || true
          fi
          echo "::endgroup::"

          if [ "$FAIL_ON_TRIVY" = "true" ] && [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Trivy found $CRITICAL CRITICAL vulnerabilities in $IMAGE_REF"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          image_uri="${{ steps.image-meta.outputs.image_uri }}"
          docker push "${image_uri}:${{ env.IMAGE_TAG }}"
          if [ "${{ inputs.publish_latest }}" = "true" ]; then
            docker tag "${image_uri}:${{ env.IMAGE_TAG }}" "${image_uri}:${{ steps.image-meta.outputs.latest_tag }}"
            docker push "${image_uri}:${{ steps.image-meta.outputs.latest_tag }}"
          fi
          if [ -n "${{ steps.image-meta.outputs.pr_tag }}" ]; then
            docker tag "${image_uri}:${{ env.IMAGE_TAG }}" "${image_uri}:${{ steps.image-meta.outputs.pr_tag }}"
            docker push "${image_uri}:${{ steps.image-meta.outputs.pr_tag }}"
          fi

      - name: Notify Slack on success
        if: success() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.success_payload }}

      - name: Notify Slack on failure
        if: failure() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.failure_payload }}

  railway-image-updater:
    name: Sync Railway service images
    needs: build-and-push
    if: |
      needs.build-and-push.result == 'success' &&
      inputs.enable_railway_image_updater &&
      inputs.railway_project_id != '' &&
      inputs.railway_environment_id != '' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve GHCR image prefixes
        id: ghcr
        shell: bash
        env:
          GHCR_REPO_NAME: ${{ inputs.ghcr_repo_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(echo "${REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${GHCR_REPO_NAME}" ]; then
            repo_name="$(echo "${GHCR_REPO_NAME}" | tr '[:upper:]' '[:lower:]')"
          fi
          prefix="ghcr.io/${owner}/${repo_name}"
          {
            echo "prefix=${prefix}"
            echo "prefixes_json=[\"${prefix}-backend\",\"${prefix}-devops-frontend\"]"
          } >> "$GITHUB_OUTPUT"

      - name: Sync Railway service images
        shell: bash
        env:
          UPDATER_URL: ${{ inputs.railway_image_updater_url != '' && inputs.railway_image_updater_url || vars.RAILWAY_IMAGE_UPDATER_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ inputs.railway_project_id }}
          ENVIRONMENT_ID: ${{ inputs.railway_environment_id }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PREFIX: ${{ steps.ghcr.outputs.prefix }}
          IMAGE_PREFIXES: ${{ steps.ghcr.outputs.prefixes_json }}
        run: |
          set -euo pipefail
          if [ -n "${UPDATER_URL}" ]; then
            payload="$(python3 <<'PY'
          import json, os
          prefix = os.environ["PREFIX"]
          print(json.dumps({
              "project_id": os.environ["PROJECT_ID"],
              "environment_id": os.environ["ENVIRONMENT_ID"],
              "image_prefixes": [
                  f"{prefix}-backend",
                  f"{prefix}-devops-frontend",
              ],
              "new_version": os.environ["IMAGE_TAG"],
          }))
          PY
          )"
            echo "Calling Railway Image Updater at ${UPDATER_URL%/}/update for tag ${IMAGE_TAG}"
            curl --fail --show-error --silent \
              -X PUT "${UPDATER_URL%/}/update" \
              -H "Content-Type: application/json" \
              -d "${payload}"
            exit 0
          fi
          if [ -n "${RAILWAY_TOKEN}" ]; then
            echo "Syncing via Railway GraphQL API for tag ${IMAGE_TAG}"
            python3 .github/scripts/railway_sync_ghcr_images.py
            exit 0
          fi
          echo "::error::Sync Railway service images was enabled but not configured."
          echo "Set GitHub Actions secret RAILWAY_TOKEN (recommended), or repository variable RAILWAY_IMAGE_UPDATER_URL."
          echo "Deploy Dev already passes project/environment IDs; PR workflows skip this job by design."
          exit 1

  mark-request-complete:
    name: Mark Request Complete
    needs:
      - build-and-push
      - railway-image-updater
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (needs.railway-image-updater.result == 'success' || needs.railway-image-updater.result == 'skipped') &&
      inputs.backend_api_url != '' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve request callback identity
        id: resolve-request
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          APPLICATION_ID: ${{ inputs.application_id }}
          COMPLETION_STATUS: ${{ inputs.completion_status }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          request_id = os.environ.get("REQUEST_ID", "").strip()
          explicit_application_id = os.environ.get("APPLICATION_ID", "").strip()
          explicit_status = os.environ.get("COMPLETION_STATUS", "").strip().lower().replace("-", "_").replace(" ", "_")
          event_name = os.environ.get("EVENT_NAME", "").strip().lower()

          def extract_application_id(text: str) -> str:
              if not text:
                  return ""
              text = text.strip().replace("refs/heads/", "")
              direct = re.search(r"^project(?:/[^/\s]+){5}/([A-Za-z0-9]{10,12})$", text)
              if direct:
                  return direct.group(1)
              embedded = re.search(r"project(?:/[^/\s]+){5}/([A-Za-z0-9]{10,12})", text)
              if embedded:
                  return embedded.group(1)
              return ""

          candidates = [
              explicit_application_id,
              os.environ.get("PR_HEAD_REF", ""),
              os.environ.get("HEAD_REF", ""),
              os.environ.get("REF_NAME", ""),
              os.environ.get("HEAD_COMMIT_MESSAGE", ""),
          ]

          resolved_application_id = ""
          for candidate in candidates:
              resolved_application_id = extract_application_id(candidate)
              if resolved_application_id:
                  break

          resolved_status = explicit_status
          if not resolved_status:
              if event_name == "push":
                  resolved_status = "merge_success"
              else:
                  resolved_status = "deploy_success"

          print(f"request_id={request_id}")
          print(f"application_id={resolved_application_id}")
          print(f"completion_status={resolved_status}")
          print(f"has_identity={'true' if request_id or resolved_application_id else 'false'}")
          PY

      - name: Notify backend that request is completed
        if: steps.resolve-request.outputs.has_identity == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve-request.outputs.request_id }}
          APPLICATION_ID: ${{ steps.resolve-request.outputs.application_id }}
          COMPLETION_STATUS: ${{ steps.resolve-request.outputs.completion_status }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          BACKEND_API_URL: ${{ inputs.backend_api_url }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SHA_VALUE: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [ -z "${CI_WEBHOOK_SECRET}" ]; then
            echo "::warning::CI_WEBHOOK_SECRET is not set; skipping request completion callback"
            exit 0
          fi

          callback_url="${BACKEND_API_URL%/}/api/webhooks/ci"
          ref_name="${HEAD_REF:-$REF_NAME}"
          details="Deploy workflow succeeded for ${ENVIRONMENT_NAME} on ${ref_name} (${SHA_VALUE}). Run: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          request_id_json=null
          if [ -n "${REQUEST_ID}" ]; then
            request_id_json="${REQUEST_ID}"
          fi

          application_id_json=null
          if [ -n "${APPLICATION_ID}" ]; then
            application_id_json="\"${APPLICATION_ID}\""
          fi

          release_notes_json=$(python3 - <<'PY'
          import json
          import os
          print(json.dumps(os.environ.get("RELEASE_NOTES", "")))
          PY
          )
          details_json=$(DETAILS="${details}" python3 - <<'PY'
          import json
          import os
          print(json.dumps(os.environ["DETAILS"]))
          PY
          )

          payload=$(cat <<JSON
          {
            "request_id": ${request_id_json},
            "application_id": ${application_id_json},
            "status": "${COMPLETION_STATUS}",
            "details": ${details_json},
            "cost_estimate": ${release_notes_json}
          }
          JSON
          )

          curl --fail --show-error --silent \
            -X POST "${callback_url}" \
            -H "Content-Type: application/json" \
            -H "X-CI-Secret: ${CI_WEBHOOK_SECRET}" \
            -d "${payload}"
