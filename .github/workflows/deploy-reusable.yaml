name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      public_api_url:
        required: true
        type: string
      release_notes:
        required: false
        type: string
        default: ""
    secrets:
      # SONAR_TOKEN:
      #   required: true
      SNYK_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HAS_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
  NEXT_PUBLIC_API_URL: ${{ inputs.public_api_url }}

jobs:
  quality-gates:
    uses: ngsops/devops_project/.github/actions/quality-gates-reusable@v1.9
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-and-push:
    name: Build, Scan, and Push Images
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_suffix: backend
            needs_api_url: false
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_suffix: frontend
            needs_api_url: true
          - service: admin-frontend
            context: ./admin-frontend
            dockerfile: ./admin-frontend/Dockerfile
            image_suffix: admin-frontend
            needs_api_url: true
          - service: devops-frontend
            context: ./devops-frontend
            dockerfile: ./devops-frontend/Dockerfile
            image_suffix: devops-frontend
            needs_api_url: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image_uri="${{ env.REGISTRY }}/${owner}/${repo}-${{ matrix.image_suffix }}"
          latest_tag="${{ inputs.environment_name }}-latest"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare Slack notification payloads
        id: notify-meta
        shell: bash
        env:
          SERVICE_NAME: ${{ matrix.service }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          IMAGE_URI: ${{ steps.image-meta.outputs.image_uri }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          NEEDS_API_URL: ${{ matrix.needs_api_url }}
          PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          SHA_VALUE: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          env_name = os.environ["ENVIRONMENT_NAME"]
          service = os.environ["SERVICE_NAME"]
          image = f'{os.environ["IMAGE_URI"]}:{os.environ["IMAGE_TAG"]}'
          release_notes = os.environ.get("RELEASE_NOTES", "").strip() or "Not provided"
          ref_name = os.environ.get("HEAD_REF", "").strip() or os.environ.get("REF_NAME", "").strip()
          short_sha = os.environ["SHA_VALUE"][:7]
          run_url = f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}'
          public_api_url = os.environ.get("PUBLIC_API_URL", "").strip() if os.environ.get("NEEDS_API_URL") == "true" else "not-required"

          def build_payload(color: str, title: str) -> dict:
              fields = [
                  {"type": "mrkdwn", "text": f"*Environment:*\n{env_name}"},
                  {"type": "mrkdwn", "text": f"*Service:*\n{service}"},
                  {"type": "mrkdwn", "text": f"*Repository:*\n{os.environ['REPOSITORY']}"},
                  {"type": "mrkdwn", "text": f"*Triggered by:*\n{os.environ['ACTOR']}"},
                  {"type": "mrkdwn", "text": f"*Ref:*\n{ref_name}"},
                  {"type": "mrkdwn", "text": f"*Commit:*\n{short_sha}"},
                  {"type": "mrkdwn", "text": f"*Image:*\n{image}"},
                  {"type": "mrkdwn", "text": f"*NEXT_PUBLIC_API_URL:*\n{public_api_url}"},
              ]
              return {
                  "attachments": [
                      {
                          "color": color,
                          "blocks": [
                              {
                                  "type": "header",
                                  "text": {
                                      "type": "plain_text",
                                      "text": title,
                                  },
                              },
                              {
                                  "type": "section",
                                  "fields": fields,
                              },
                              {
                                  "type": "section",
                                  "text": {
                                      "type": "mrkdwn",
                                      "text": f"*Release notes:*\n{release_notes}",
                                  },
                              },
                              {
                                  "type": "context",
                                  "elements": [
                                      {
                                          "type": "mrkdwn",
                                          "text": f'Workflow: {os.environ["WORKFLOW_NAME"]} | Run #{os.environ["RUN_NUMBER"]}',
                                      }
                                  ],
                              },
                              {
                                  "type": "actions",
                                  "elements": [
                                      {
                                          "type": "button",
                                          "text": {
                                              "type": "plain_text",
                                              "text": "Open workflow run",
                                          },
                                          "url": run_url,
                                      }
                                  ],
                              },
                          ],
                      }
                  ]
              }

          success_payload = build_payload("#16a34a", f"Deploy succeeded - {env_name} - {service}")
          failure_payload = build_payload("#dc2626", f"Deploy failed - {env_name} - {service}")

          print("success_payload<<__JSON__")
          print(json.dumps(success_payload))
          print("__JSON__")
          print("failure_payload<<__JSON__")
          print(json.dumps(failure_payload))
          print("__JSON__")
          PY

      - name: Validate public API URL
        if: matrix.needs_api_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is required for frontend image builds"
            exit 1
          fi

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.needs_api_url && format('NEXT_PUBLIC_API_URL={0}', env.NEXT_PUBLIC_API_URL) || '' }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}" "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"

      - name: Notify Slack on success
        if: success() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.success_payload }}

      - name: Notify Slack on failure
        if: failure() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.failure_payload }}