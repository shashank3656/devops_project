name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      public_api_url:
        required: true
        type: string
      release_notes:
        required: false
        type: string
        default: ""
    secrets:
      # SONAR_TOKEN:
      #   required: true
      SNYK_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HAS_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
  NEXT_PUBLIC_API_URL: ${{ inputs.public_api_url }}

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates-reusable.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-and-push:
    name: Build, Scan, and Push Images
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_suffix: backend
            needs_api_url: false
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_suffix: frontend
            needs_api_url: true
          - service: admin-frontend
            context: ./admin-frontend
            dockerfile: ./admin-frontend/Dockerfile
            image_suffix: admin-frontend
            needs_api_url: true
          - service: devops-frontend
            context: ./devops-frontend
            dockerfile: ./devops-frontend/Dockerfile
            image_suffix: devops-frontend
            needs_api_url: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image_uri="${{ env.REGISTRY }}/${owner}/${repo}-${{ matrix.image_suffix }}"
          latest_tag="${{ inputs.environment_name }}-latest"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Validate public API URL
        if: matrix.needs_api_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is required for frontend image builds"
            exit 1
          fi

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.needs_api_url && format('NEXT_PUBLIC_API_URL={0}', env.NEXT_PUBLIC_API_URL) || '' }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}" "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"

      - name: Notify Slack on success
        if: success() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#16a34a",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Deploy Pipeline Succeeded"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Environment:*\n${{ inputs.environment_name }}" },
                        { "type": "mrkdwn", "text": "*Service:*\n${{ matrix.service }}" },
                        { "type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}" },
                        { "type": "mrkdwn", "text": "*Image:*\n${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}" },
                        { "type": "mrkdwn", "text": "*NEXT_PUBLIC_API_URL:*\n${{ matrix.needs_api_url && env.NEXT_PUBLIC_API_URL || 'not-required' }}" },
                        { "type": "mrkdwn", "text": "*Release Notes:*\n${{ inputs.release_notes != '' && inputs.release_notes || 'Not provided' }}" }
                      ]
                    },
                    {
                      "type": "context",
                      "elements": [
                        { "type": "mrkdwn", "text": "Workflow: ${{ github.workflow }} | Run #${{ github.run_number }}" }
                      ]
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack on failure
        if: failure() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#dc2626",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Deploy Pipeline Failed"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Environment:*\n${{ inputs.environment_name }}" },
                        { "type": "mrkdwn", "text": "*Service:*\n${{ matrix.service }}" },
                        { "type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}" },
                        { "type": "mrkdwn", "text": "*Image:*\n${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}" },
                        { "type": "mrkdwn", "text": "*NEXT_PUBLIC_API_URL:*\n${{ matrix.needs_api_url && env.NEXT_PUBLIC_API_URL || 'not-required' }}" },
                        { "type": "mrkdwn", "text": "*Release Notes:*\n${{ inputs.release_notes != '' && inputs.release_notes || 'Not provided' }}" }
                      ]
                    },
                    {
                      "type": "context",
                      "elements": [
                        { "type": "mrkdwn", "text": "Workflow: ${{ github.workflow }} | Run #${{ github.run_number }}" }
                      ]
                    }
                  ]
                }
              ]
            }
