name: Deploy Reusable

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      public_api_url:
        required: true
        type: string
      release_notes:
        required: false
        type: string
        default: ""
    secrets:
      SNYK_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HAS_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
  NEXT_PUBLIC_API_URL: ${{ inputs.public_api_url }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run quality gates
        uses: ./.github/actions/quality-gates-reusable
        with:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-and-push:
    name: Build, Scan, and Push Images
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_suffix: backend
            needs_api_url: false
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_suffix: frontend
            needs_api_url: true
          - service: admin-frontend
            context: ./admin-frontend
            dockerfile: ./admin-frontend/Dockerfile
            image_suffix: admin-frontend
            needs_api_url: true
          - service: devops-frontend
            context: ./devops-frontend
            dockerfile: ./devops-frontend/Dockerfile
            image_suffix: devops-frontend
            needs_api_url: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image_uri="${{ env.REGISTRY }}/${owner}/${repo}-${{ matrix.image_suffix }}"
          latest_tag="${{ inputs.environment_name }}-latest"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Validate public API URL
        if: matrix.needs_api_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is required for frontend image builds"
            exit 1
          fi

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.needs_api_url && format('NEXT_PUBLIC_API_URL={0}', env.NEXT_PUBLIC_API_URL) || '' }}

      # 🔐 Trivy Scan (UPDATED)
      - name: Trivy Advanced Container Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln,secret,config"
          timeout: "10m"

      # 📊 Summary Board (NEW)
      - name: Trivy Summary Board
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)
          MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json)
          LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json)

          echo "## 🔐 Trivy Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Image" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH     | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM   | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW      | $LOW |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "### ❌ Status: Failed (High/Critical vulnerabilities found)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: Passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}" "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"
          
      - name: Notify Slack on success
        if: success() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.success_payload }}

      - name: Notify Slack on failure
        if: failure() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.failure_payload }}