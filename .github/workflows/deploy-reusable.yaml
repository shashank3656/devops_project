name: Deploy Reusable

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      public_api_url:
        required: true
        type: string
      backend_api_url:
        required: false
        type: string
        default: ""
      request_id:
        required: false
        type: string
        default: ""
      application_id:
        required: false
        type: string
        default: ""
      completion_status:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
    secrets:
      SNYK_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      CI_WEBHOOK_SECRET:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HAS_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
  NEXT_PUBLIC_API_URL: ${{ inputs.public_api_url }}
  BACKEND_API_URL: ${{ inputs.backend_api_url }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run quality gates
        uses: ./.github/actions/quality-gates-reusable
        with:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-and-push:
    name: Build, Scan, and Push Images
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_suffix: backend
            needs_api_url: false
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_suffix: frontend
            needs_api_url: true
          - service: admin-frontend
            context: ./admin-frontend
            dockerfile: ./admin-frontend/Dockerfile
            image_suffix: admin-frontend
            needs_api_url: true
          - service: devops-frontend
            context: ./devops-frontend
            dockerfile: ./devops-frontend/Dockerfile
            image_suffix: devops-frontend
            needs_api_url: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image_uri="${{ env.REGISTRY }}/${owner}/${repo}-${{ matrix.image_suffix }}"
          latest_tag="${{ inputs.environment_name }}-latest"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare Slack notification payloads
        id: notify-meta
        shell: bash
        env:
          SERVICE_NAME: ${{ matrix.service }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          IMAGE_URI: ${{ steps.image-meta.outputs.image_uri }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          NEEDS_API_URL: ${{ matrix.needs_api_url }}
          PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          SHA_VALUE: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          env_name = os.environ["ENVIRONMENT_NAME"]
          service = os.environ["SERVICE_NAME"]
          image = f'{os.environ["IMAGE_URI"]}:{os.environ["IMAGE_TAG"]}'
          release_notes = os.environ.get("RELEASE_NOTES", "").strip() or "Not provided"
          ref_name = os.environ.get("HEAD_REF", "").strip() or os.environ.get("REF_NAME", "").strip()
          short_sha = os.environ["SHA_VALUE"][:7]
          run_url = f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}'
          public_api_url = os.environ.get("PUBLIC_API_URL", "").strip() if os.environ.get("NEEDS_API_URL") == "true" else "not-required"

          def build_payload(color: str, title: str) -> dict:
              fields = [
                  {"type": "mrkdwn", "text": f"*Environment:*\n{env_name}"},
                  {"type": "mrkdwn", "text": f"*Service:*\n{service}"},
                  {"type": "mrkdwn", "text": f"*Repository:*\n{os.environ['REPOSITORY']}"},
                  {"type": "mrkdwn", "text": f"*Triggered by:*\n{os.environ['ACTOR']}"},
                  {"type": "mrkdwn", "text": f"*Ref:*\n{ref_name}"},
                  {"type": "mrkdwn", "text": f"*Commit:*\n{short_sha}"},
                  {"type": "mrkdwn", "text": f"*Image:*\n{image}"},
                  {"type": "mrkdwn", "text": f"*NEXT_PUBLIC_API_URL:*\n{public_api_url}"},
              ]
              return {
                  "attachments": [
                      {
                          "color": color,
                          "blocks": [
                              {
                                  "type": "header",
                                  "text": {"type": "plain_text", "text": title},
                              },
                              {
                                  "type": "section",
                                  "fields": fields,
                              },
                              {
                                  "type": "section",
                                  "text": {
                                      "type": "mrkdwn",
                                      "text": f"*Release notes:*\n{release_notes}",
                                  },
                              },
                              {
                                  "type": "context",
                                  "elements": [
                                      {
                                          "type": "mrkdwn",
                                          "text": f'Workflow: {os.environ["WORKFLOW_NAME"]} | Run #{os.environ["RUN_NUMBER"]}',
                                      }
                                  ],
                              },
                              {
                                  "type": "actions",
                                  "elements": [
                                      {
                                          "type": "button",
                                          "text": {"type": "plain_text", "text": "Open workflow run"},
                                          "url": run_url,
                                      }
                                  ],
                              },
                          ],
                      }
                  ]
              }

          success_payload = build_payload("#16a34a", f"Deploy succeeded - {env_name} - {service}")
          failure_payload = build_payload("#dc2626", f"Deploy failed - {env_name} - {service}")

          print("success_payload<<__JSON__")
          print(json.dumps(success_payload))
          print("__JSON__")
          print("failure_payload<<__JSON__")
          print(json.dumps(failure_payload))
          print("__JSON__")
          PY

      - name: Validate public API URL
        if: matrix.needs_api_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is required for frontend image builds"
            exit 1
          fi

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.needs_api_url && format('NEXT_PUBLIC_API_URL={0}', env.NEXT_PUBLIC_API_URL) || '' }}

      # 🔐 Trivy Scan (UPDATED)
      - name: Trivy Advanced Container Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln,secret,config"
          timeout: "10m"

      # 📊 Summary Board (NEW)
      - name: Trivy Summary Board
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)
          MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json)
          LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json)

          echo "## 🔐 Trivy Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Image" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH     | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM   | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW      | $LOW |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "### ❌ Status: Failed (High/Critical vulnerabilities found)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: Passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}" "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ env.IMAGE_TAG }}"
          docker push "${{ steps.image-meta.outputs.image_uri }}:${{ steps.image-meta.outputs.latest_tag }}"

      - name: Notify Slack on success
        if: success() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.success_payload }}

      - name: Notify Slack on failure
        if: failure() && env.HAS_SLACK_WEBHOOK_URL == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.notify-meta.outputs.failure_payload }}

  mark-request-complete:
    name: Mark Request Complete
    needs: build-and-push
    if: success() && inputs.backend_api_url != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve request callback identity
        id: resolve-request
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          APPLICATION_ID: ${{ inputs.application_id }}
          COMPLETION_STATUS: ${{ inputs.completion_status }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          request_id = os.environ.get("REQUEST_ID", "").strip()
          explicit_application_id = os.environ.get("APPLICATION_ID", "").strip()
          explicit_status = os.environ.get("COMPLETION_STATUS", "").strip().lower().replace("-", "_").replace(" ", "_")
          event_name = os.environ.get("EVENT_NAME", "").strip().lower()

          def extract_application_id(text: str) -> str:
              if not text:
                  return ""
              text = text.strip().replace("refs/heads/", "")
              direct = re.search(r"^project(?:/[^/\s]+){5}/([A-Za-z0-9]{10,12})$", text)
              if direct:
                  return direct.group(1)
              embedded = re.search(r"project(?:/[^/\s]+){5}/([A-Za-z0-9]{10,12})", text)
              if embedded:
                  return embedded.group(1)
              return ""

          candidates = [
              explicit_application_id,
              os.environ.get("PR_HEAD_REF", ""),
              os.environ.get("HEAD_REF", ""),
              os.environ.get("REF_NAME", ""),
              os.environ.get("HEAD_COMMIT_MESSAGE", ""),
          ]

          resolved_application_id = ""
          for candidate in candidates:
              resolved_application_id = extract_application_id(candidate)
              if resolved_application_id:
                  break

          resolved_status = explicit_status
          if not resolved_status:
              if event_name == "push":
                  resolved_status = "merge_success"
              else:
                  resolved_status = "deploy_success"

          print(f"request_id={request_id}")
          print(f"application_id={resolved_application_id}")
          print(f"completion_status={resolved_status}")
          print(f"has_identity={'true' if request_id or resolved_application_id else 'false'}")
          PY

      - name: Notify backend that request is completed
        if: steps.resolve-request.outputs.has_identity == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve-request.outputs.request_id }}
          APPLICATION_ID: ${{ steps.resolve-request.outputs.application_id }}
          COMPLETION_STATUS: ${{ steps.resolve-request.outputs.completion_status }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          BACKEND_API_URL: ${{ inputs.backend_api_url }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SHA_VALUE: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [ -z "${CI_WEBHOOK_SECRET}" ]; then
            echo "::warning::CI_WEBHOOK_SECRET is not set; skipping request completion callback"
            exit 0
          fi

          callback_url="${BACKEND_API_URL%/}/api/webhooks/ci"
          ref_name="${HEAD_REF:-$REF_NAME}"
          details="Deploy workflow succeeded for ${ENVIRONMENT_NAME} on ${ref_name} (${SHA_VALUE}). Run: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          request_id_json=null
          if [ -n "${REQUEST_ID}" ]; then
            request_id_json="${REQUEST_ID}"
          fi

          application_id_json=null
          if [ -n "${APPLICATION_ID}" ]; then
            application_id_json="\"${APPLICATION_ID}\""
          fi

          release_notes_json=$(python3 - <<'PY'
          import json
          import os
          print(json.dumps(os.environ.get("RELEASE_NOTES", "")))
          PY
          )
          details_json=$(DETAILS="${details}" python3 - <<'PY'
          import json
          import os
          print(json.dumps(os.environ["DETAILS"]))
          PY
          )

          payload=$(cat <<JSON
          {
            "request_id": ${request_id_json},
            "application_id": ${application_id_json},
            "status": "${COMPLETION_STATUS}",
            "details": ${details_json},
            "cost_estimate": ${release_notes_json}
          }
          JSON
          )

          curl --fail --show-error --silent \
            -X POST "${callback_url}" \
            -H "Content-Type: application/json" \
            -H "X-CI-Secret: ${CI_WEBHOOK_SECRET}" \
            -d "${payload}"
