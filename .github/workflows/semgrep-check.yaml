name: Semgrep Security Scan

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:

  # ==========================================================
  # JOB 1: Semgrep SAST (Go + React)
  # ==========================================================
  semgrep-sast:
    name: Semgrep SAST (Go + React)
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config "p/golang" \
            --config "p/react" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --severity ERROR \
            --sarif \
            --output semgrep-sast.sarif

      - name: Generate Readable Summary
        if: always()
        run: |
          semgrep scan \
            --config "p/golang" \
            --config "p/react" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/secrets" \
            --severity ERROR \
            --json \
            --output semgrep.json || true

          echo "## 🔐 Semgrep SAST Results" >> $GITHUB_STEP_SUMMARY
          COUNT=$(jq '.results | length' semgrep.json)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**High/Critical Findings: $COUNT**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$COUNT" -gt 0 ]; then
            echo "| Severity | Rule | File | Line |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------|------|------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.results[] | "| \(.extra.severity) | \(.check_id) | \(.path) | \(.start.line) |"' semgrep.json >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No high/critical issues found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SAST SARIF to GitHub
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-sast.sarif
          category: semgrep-sast

      - name: Upload SAST Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep-sast.sarif
          retention-days: 30


  # ==========================================================
  # JOB 2: Semgrep Supply Chain (Dependencies)
  # ==========================================================
  semgrep-sca:
    name: Semgrep Supply Chain Scan
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Supply Chain Scan
        run: |
          semgrep scan \
            --config "p/supply-chain" \
            --severity ERROR \
            --sarif \
            --output semgrep-sca.sarif

      - name: Upload SCA SARIF to GitHub
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-sca.sarif
          category: semgrep-sca

      - name: Upload SCA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sca-report
          path: semgrep-sca.sarif
          retention-days: 30


  # ==========================================================
  # JOB 3: Security Gate (Blocks PR if needed)
  # ==========================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep-sast, semgrep-sca]

    steps:
      - name: Enforce Security Gate
        run: |
          if [[ "${{ needs.semgrep-sast.result }}" == "failure" || \
                "${{ needs.semgrep-sca.result }}" == "failure" ]]; then
            echo "❌ Security Gate FAILED — High/Critical vulnerabilities detected."
            exit 1
          else
            echo "✅ Security Gate PASSED — No blocking vulnerabilities."
          fi