name: Semgrep Security Scan

on:
  push:
    branches:
      - "feature/*"
      - "feature/**"

  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Semgrep SAST — Go Backend
  # ─────────────────────────────────────────────
  semgrep-go:
    name: Semgrep SAST — Go
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep on Go Code
        run: |
          semgrep scan \
            --config "p/golang" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/sql-injection" \
            --sarif \
            --output semgrep-go-results.sarif \
            --severity ERROR \
            --error

      # Upload SARIF only if not a fork PR
      - name: Upload Go SARIF to GitHub Security Tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-go-results.sarif
          category: semgrep-go

      - name: Upload Go Scan Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-go-report
          path: semgrep-go-results.sarif
          retention-days: 30


  # ─────────────────────────────────────────────
  # JOB 2: Semgrep SAST — ReactJS Frontend
  # ─────────────────────────────────────────────
  semgrep-react:
    name: Semgrep SAST — ReactJS
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep on React Code
        run: |
          semgrep scan \
            --config "p/react" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/secrets" \
            --config "p/xss" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output semgrep-react-results.sarif \
            --severity ERROR \
            --error

      - name: Upload React SARIF to GitHub Security Tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-react-results.sarif
          category: semgrep-react

      - name: Upload React Scan Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-react-report
          path: semgrep-react-results.sarif
          retention-days: 30


  # ─────────────────────────────────────────────
  # JOB 3: Semgrep SCA — Dependency Scan
  # ─────────────────────────────────────────────
  semgrep-sca:
    name: Semgrep SCA — Dependencies
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Supply Chain Scan
        run: |
          semgrep scan \
            --config "p/supply-chain" \
            --sarif \
            --output semgrep-sca-results.sarif \
            --severity ERROR \
            --error

      - name: Upload SCA SARIF to GitHub Security Tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-sca-results.sarif
          category: semgrep-sca

      - name: Upload SCA Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sca-report
          path: semgrep-sca-results.sarif
          retention-days: 30


  # ─────────────────────────────────────────────
  # JOB 4: Security Gate
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep-go, semgrep-react, semgrep-sca]
    if: always()

    steps:
      - name: Enforce Security Gate
        run: |
          if [[ "${{ needs.semgrep-go.result }}" == "failure" || \
                "${{ needs.semgrep-react.result }}" == "failure" || \
                "${{ needs.semgrep-sca.result }}" == "failure" ]]; then
            echo "❌ Security Gate FAILED — vulnerabilities detected. PR merge blocked."
            exit 1
          else
            echo "✅ Security Gate PASSED — no blocking vulnerabilities found."
          fi