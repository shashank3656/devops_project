name: Semgrep Security Scan

on:
  # ✅ Trigger on every push to any feature branch
  push:
    branches:
      - "feature/*"
      - "feature/**"

  # ✅ Trigger on PR from feature/* targeting dev branch
  pull_request:
    branches:
      - dev
    types:
      - opened        # PR created
      - synchronize   # New commit pushed to existing PR
      - reopened      # PR reopened after close

permissions:
  contents: read
  security-events: write   # Required to upload SARIF to GitHub Security tab
  pull-requests: write     # Required to post PR comments

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Semgrep SAST — Go Backend
  # ─────────────────────────────────────────────
  semgrep-go:
    name: Semgrep SAST — Go
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep on Go Code
        run: |
          semgrep ci \
            --config "p/golang" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/sql-injection" \
            --sarif --output semgrep-go-results.sarif \
            --error \
            --severity ERROR \
            --severity WARNING
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Go SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-go-results.sarif
          category: semgrep-go

      - name: Upload Go Scan Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-go-report
          path: semgrep-go-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Semgrep SAST — ReactJS Frontend
  # ─────────────────────────────────────────────
  semgrep-react:
    name: Semgrep SAST — ReactJS
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep on React Code
        run: |
          semgrep ci \
            --config "p/react" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/secrets" \
            --config "p/xss" \
            --config "p/owasp-top-ten" \
            --sarif --output semgrep-react-results.sarif \
            --error \
            --severity ERROR \
            --severity WARNING
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload React SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-react-results.sarif
          category: semgrep-react

      - name: Upload React Scan Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-react-report
          path: semgrep-react-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Dependency Vulnerability Scan (SCA)
  # ─────────────────────────────────────────────
  semgrep-sca:
    name: Semgrep SCA — Dependencies
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Supply Chain (go.mod + package.json)
        run: |
          semgrep ci \
            --config "p/supply-chain" \
            --sarif --output semgrep-sca-results.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SCA SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-sca-results.sarif
          category: semgrep-sca

      - name: Upload SCA Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sca-report
          path: semgrep-sca-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 4: Gate — Block PR if any scan failed
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [semgrep-go, semgrep-react, semgrep-sca]
    if: always()

    steps:
      - name: Check All Scan Results
        run: |
          if [[ "${{ needs.semgrep-go.result }}" == "failure" || \
                "${{ needs.semgrep-react.result }}" == "failure" || \
                "${{ needs.semgrep-sca.result }}" == "failure" ]]; then
            echo "❌ Security Gate FAILED — vulnerabilities found. PR merge is blocked."
            exit 1
          else
            echo "✅ Security Gate PASSED — no critical vulnerabilities found."
          fi