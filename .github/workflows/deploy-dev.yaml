name: Deploy Dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - feature/**
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL_DEV || vars.NEXT_PUBLIC_API_URL }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/')
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-reusable.yaml
    with:
      environment_name: dev
      public_api_url: ${{ env.NEXT_PUBLIC_API_URL }}
    secrets: inherit
