# After GHCR push, optional Railway Image Updater sync (deploy the template once per project):
# https://railway.com/deploy/railway-image-updater
# Railway sync (after GHCR push): set ONE of —
#   Secret RAILWAY_TOKEN (recommended; uses GraphQL in the workflow), OR
#   Variable RAILWAY_IMAGE_UPDATER_URL (https://railway.com/deploy/railway-image-updater)
# Optional GitHub vars override defaults: RAILWAY_ENVIRONMENT_ID_DEV, RAILWAY_ENVIRONMENT_ID, RAILWAY_PROJECT_ID
# Defaults (dev): project 5332b847-9bab-40fc-83b5-7fbf3a1d2ab0 · environment 916b3e46-9336-4c69-ac06-e44d406ce737
# Service → GHCR image prefix (same commit tag on all):
#   backend-api              → ghcr.io/<owner>/devops_project-backend
#   devops_project-devops-frontend → ghcr.io/<owner>/devops_project-devops-frontend
name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional request id to mark completed after successful deployment
        required: false
        type: string
      application_id:
        description: Optional application id to mark completed after successful deployment
        required: false
        type: string
  pull_request:
    branches:
      - master
      - main
      - dev
      - feature/**
      - feat/cicd-fixes
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/')
    uses: ./.github/workflows/deploy-reusable.yaml
    secrets: inherit
    with:
      environment_name: dev
      public_api_url: ${{ vars.NEXT_PUBLIC_API_URL_DEV || vars.NEXT_PUBLIC_API_URL || 'https://backend-api-production-ed.up.railway.app' }}
      backend_api_url: ${{ vars.BACKEND_API_URL_DEV || vars.BACKEND_API_URL }}
      request_id: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || '' }}
      application_id: ${{ github.event_name == 'workflow_dispatch' && inputs.application_id || '' }}
      publish_latest: ${{ github.event_name != 'pull_request' }}
      fail_on_trivy: ${{ github.event_name != 'pull_request' }}
      pr_number: ${{ github.event.pull_request.number || '' }}
      enable_railway_image_updater: ${{ github.event_name != 'pull_request' }}
      railway_project_id: ${{ vars.RAILWAY_PROJECT_ID || '5332b847-9bab-40fc-83b5-7fbf3a1d2ab0' }}
      railway_environment_id: ${{ vars.RAILWAY_ENVIRONMENT_ID_DEV || vars.RAILWAY_ENVIRONMENT_ID || '916b3e46-9336-4c69-ac06-e44d406ce737' }}
      railway_image_updater_url: ${{ vars.RAILWAY_IMAGE_UPDATER_URL }}
      ghcr_repo_name: devops_project
