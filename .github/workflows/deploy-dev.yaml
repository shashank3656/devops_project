name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional request id to mark completed after successful deployment
        required: false
        type: string
      application_id:
        description: Optional application id to mark completed after successful deployment
        required: false
        type: string
  pull_request:
    branches:
      - dev
      - feature/**
      - feat/cicd-fixes
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/')
    uses: ./.github/workflows/deploy-reusable.yaml
    secrets: inherit
    with:
      environment_name: dev
      public_api_url: ${{ vars.NEXT_PUBLIC_API_URL_DEV || vars.NEXT_PUBLIC_API_URL }}
      backend_api_url: ${{ vars.BACKEND_API_URL_DEV || vars.BACKEND_API_URL }}
      request_id: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || '' }}
      application_id: ${{ github.event_name == 'workflow_dispatch' && inputs.application_id || '' }}
