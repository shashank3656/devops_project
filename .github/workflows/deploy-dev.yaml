name: Deploy Dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - feature/**
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  

jobs:
  deploy:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/')
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-reusable.yaml
    with:
      environment_name: dev
      values_file: ./helm/infragate/values-dev.yaml
      release_name: infragate-dev
      namespace: infragate-dev
    secrets: inherit
