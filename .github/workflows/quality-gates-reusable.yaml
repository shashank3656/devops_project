name: Reusable Quality Gates

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: false

permissions:
  contents: read

env:
  HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required quality-gate configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for key in SONAR_HOST_URL SONAR_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required quality-gate variable or secret: $key"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Install user portal dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Install admin portal dependencies
        working-directory: ./admin-frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Install DevOps portal dependencies
        working-directory: ./devops-frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Download Go modules
        working-directory: ./backend
        run: go mod download

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dproject.settings=.github/action/sonar-project.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Wait for SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Install Snyk CLI
        if: env.HAS_SNYK_TOKEN == 'true'
        run: npm install --global snyk

      - name: Run Snyk dependency scan
        if: env.HAS_SNYK_TOKEN == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --detection-depth=4 --severity-threshold=high

      - name: Skip optional Snyk scan
        if: env.HAS_SNYK_TOKEN != 'true'
        run: echo "Snyk token not configured; skipping optional dependency scan."
