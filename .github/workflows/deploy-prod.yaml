name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes for this production deployment
        required: true
        type: string
  push:
    branches:
      - master

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-reusable.yaml
    with:
      environment_name: prod
      public_api_url: ${{ vars.NEXT_PUBLIC_API_URL_PROD || vars.NEXT_PUBLIC_API_URL }}
      release_notes: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || format('Automated production deployment for {0}', github.sha) }}
    secrets: inherit