name: Deploy UAT

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-reusable.yaml
    with:
      environment_name: uat
      values_file: ./helm/infragate/values-uat.yaml
      release_name: infragate-uat
      namespace: infragate-uat
    secrets: inherit
