name: Deploy UAT

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional request id to mark completed after successful deployment
        required: false
        type: string
      application_id:
        description: Optional application id to mark completed after successful deployment
        required: false
        type: string
  pull_request:
    branches:
      - uat
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/')
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-reusable.yaml
    with:
      environment_name: uat
      public_api_url: ${{ vars.NEXT_PUBLIC_API_URL_UAT || vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
      backend_api_url: ${{ vars.BACKEND_API_URL_UAT || vars.BACKEND_API_URL }}
      request_id: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || '' }}
      application_id: ${{ github.event_name == 'workflow_dispatch' && inputs.application_id || '' }}
      publish_latest: ${{ github.event_name != 'pull_request' }}
      fail_on_trivy: ${{ github.event_name != 'pull_request' }}
      pr_number: ${{ github.event.pull_request.number || '' }}
    secrets: inherit
