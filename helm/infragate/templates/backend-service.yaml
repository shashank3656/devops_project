apiVersion: v1
kind: Service
metadata:
  name: {{ include "infragate.backend.fullname" . }}
  labels:
    {{- include "infragate.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "infragate.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
