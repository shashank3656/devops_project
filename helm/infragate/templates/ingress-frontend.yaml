{{- if .Values.ingress.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "infragate.fullname" . }}-frontend
  labels:
    {{- include "infragate.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-ingress
  {{- with .Values.ingress.frontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.frontend.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $name, $frontend := .Values.frontends }}
    {{- if $frontend.enabled }}
    - host: {{ $frontend.ingress.host | quote }}
      http:
        paths:
          - path: {{ $frontend.ingress.path }}
            pathType: {{ $frontend.ingress.pathType }}
            backend:
              service:
                name: {{ include "infragate.frontend.fullname" (dict "root" $ "name" $name) }}
                port:
                  number: {{ $frontend.service.port }}
    {{- end }}
    {{- end }}
  {{- with .Values.ingress.frontend.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
