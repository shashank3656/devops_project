apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infragate.backend.fullname" . }}-config
  labels:
    {{- include "infragate.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
