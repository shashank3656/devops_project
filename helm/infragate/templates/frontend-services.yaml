{{- range $name, $frontend := .Values.frontends }}
{{- if $frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infragate.frontend.fullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "infragate.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  type: {{ $frontend.service.type }}
  selector:
    {{- include "infragate.componentSelectorLabels" (dict "root" $ "component" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $frontend.service.port }}
      targetPort: http
---
{{- end }}
{{- end }}
