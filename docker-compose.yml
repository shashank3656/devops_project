version: '3.8'

# Infrastructure Portal - Docker Compose
#
# Single command to spin up all app containers against env-provided services:
#   docker-compose up -d
#
# Development (hot reload, includes admin-frontend; use override so admin-frontend uses dev backend):
#   docker-compose --profile dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Environment variables: config/.env (copy from config/.env.example)

services:
  # Redis cache / background job broker
  redis:
    image: redis:7-alpine
    container_name: infra-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-network

  # Development Backend (with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: infra-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - DB_CONN_MAX_LIFETIME_MINUTES=2
      - DB_CONN_MAX_IDLE_TIME_MINUTES=1
      - DB_MAX_OPEN_CONNS=15
      - DB_MAX_IDLE_CONNS=3
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-devops3656@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-avhbdsfwpllsgogm}
      - SMTP_FROM=${SMTP_FROM:-devops3656@gmail.com}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - GITHUB_OWNER=${GITHUB_OWNER:-ngsops}
      - GITHUB_REPO=${GITHUB_REPO:-Application_Onboarding}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-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}
      - BASE_BRANCH=${BASE_BRANCH:-main}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/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}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - FRONTEND_URL=${FRONTEND_URL:-http://34.123.156.208:3000}
      - DEVOPS_FRONTEND_URL=${DEVOPS_FRONTEND_URL:-http://34.123.156.208:3002}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_CACHE_TTL_SECONDS=${REDIS_CACHE_TTL_SECONDS:-90}
      - REDIS_QUEUE_NAME=${REDIS_QUEUE_NAME:-infra:jobs}
      - REDIS_JOB_POLL_TIMEOUT_SECONDS=${REDIS_JOB_POLL_TIMEOUT_SECONDS:-5}
      - DB_QUERY_TIMEOUT_SECONDS=${DB_QUERY_TIMEOUT_SECONDS:-5}
      - DB_TX_TIMEOUT_SECONDS=${DB_TX_TIMEOUT_SECONDS:-30}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-750}
      - REQUEST_LOG_SLOW_MS=${REQUEST_LOG_SLOW_MS:-500}
      - DB_SSLROOTCERT=/app/certs/prod-ca-2021.crt
      - SSO_LOGIN_URL=${SSO_LOGIN_URL:-}
      - SSO_AUTH_SHARED_SECRET=${SSO_AUTH_SHARED_SECRET:-}
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      - ./prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
      # Exclude vendor directory to avoid vendoring conflicts
      - /app/vendor
    # Command runs go run . from the mounted volume
    # Use -mod=mod to ignore vendor directory if it exists
    command: sh -c "go mod download && go run -mod=mod ."
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  # Production Backend (compiled binary)
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infra-backend
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-devops3656@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-avhbdsfwpllsgogm}
      - SMTP_FROM=${SMTP_FROM:-devops3656@gmail.com}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - GITHUB_OWNER=${GITHUB_OWNER:-ngsops}
      - GITHUB_REPO=${GITHUB_REPO:-Application_Onboarding}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-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}
      - BASE_BRANCH=${BASE_BRANCH:-main}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/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}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - FRONTEND_URL=${FRONTEND_URL:-http://34.123.156.208:3000}
      - DEVOPS_FRONTEND_URL=${DEVOPS_FRONTEND_URL:-http://34.123.156.208:3002}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_CACHE_TTL_SECONDS=${REDIS_CACHE_TTL_SECONDS:-90}
      - REDIS_QUEUE_NAME=${REDIS_QUEUE_NAME:-infra:jobs}
      - REDIS_JOB_POLL_TIMEOUT_SECONDS=${REDIS_JOB_POLL_TIMEOUT_SECONDS:-5}
      - DB_QUERY_TIMEOUT_SECONDS=${DB_QUERY_TIMEOUT_SECONDS:-5}
      - DB_TX_TIMEOUT_SECONDS=${DB_TX_TIMEOUT_SECONDS:-30}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-750}
      - REQUEST_LOG_SLOW_MS=${REQUEST_LOG_SLOW_MS:-500}
      - DB_SSLROOTCERT=/app/certs/prod-ca-2021.crt
      - SSO_LOGIN_URL=${SSO_LOGIN_URL:-}
      - SSO_AUTH_SHARED_SECRET=${SSO_AUTH_SHARED_SECRET:-}
    volumes:
      - ./prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  # Development Frontend (with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infra-frontend-dev
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
      - NEXT_IGNORE_INCORRECT_LOCKFILE=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # Override command to run dev server
    command: sh -c "npm install --no-package-lock && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  # Production Frontend (built and optimized)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: infra-frontend
    ports:
      - "3000:3000"
    env_file:
      - config/.env 
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://34.123.156.208:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  # Admin Frontend (runs separately on port 3001 - same backend/DB)
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    container_name: infra-admin-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev
  
  admin-frontend-prod:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    container_name: infra-admin-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    depends_on:
      - backend-prod
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod

  # DevOps Frontend (port 3002 - for DevOps users: my tickets + manager workload)
  # Backend URL is read at runtime from container env (/api/config). Set NEXT_PUBLIC_API_URL in config/.env.
  devops-frontend:
    build:
      context: ./devops-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    container_name: infra-devops-frontend
    ports:
      - "3002:3002"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.123.156.208:8080}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://34.123.156.208:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev
  
  devops-frontend-prod:
    build:
      context: ./devops-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: infra-devops-frontend
    ports:
      - "3002:3002"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend-prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod

volumes:
  redis_data:

networks:
  infra-network:
    driver: bridge
