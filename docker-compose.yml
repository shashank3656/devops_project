version: '3.8'

# SetuOps local stack
#
# Development:
#   make compose-dev
#
# Production-like:
#   make compose-prod
#
# Environment: config/.env is the only app config source.
#   make compose-dev
#   docker compose --env-file config/.env --profile dev up -d --build
# Compose only overrides values that must be in-network (Redis hostname, cert path).

services:
  redis:
    image: redis:7-alpine
    container_name: infra-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: infra-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_URL=
      - DB_SSLROOTCERT=/app/certs/prod-ca-2021.crt
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
      - /app/vendor
    command: sh -c "go mod download && go run -mod=mod ."
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  backend-prod:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: infra-backend
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_URL=
      - DB_SSLROOTCERT=/app/certs/prod-ca-2021.crt
    volumes:
      - ./config:/app/config:ro
      - ./prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: infra-frontend-dev
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=development
      - NEXT_IGNORE_INCORRECT_LOCKFILE=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - ./shared-ui:/shared-ui
      - ./shared-ui:/app/shared-ui
      - ./config:/app/config:ro
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install --no-package-lock && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: infra-frontend
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: infra-admin-frontend
    ports:
      - "3001:3001"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  admin-frontend-prod:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: infra-admin-frontend
    ports:
      - "3001:3001"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-prod
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod

  devops-frontend:
    build:
      context: .
      dockerfile: devops-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: infra-devops-frontend
    ports:
      - "3002:3002"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  devops-frontend-prod:
    build:
      context: .
      dockerfile: devops-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: infra-devops-frontend
    ports:
      - "3002:3002"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - backend-prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod

volumes:
  redis_data:

networks:
  infra-network:
    driver: bridge
