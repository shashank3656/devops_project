version: '3.8'

# Infrastructure Portal - Docker Compose
# 
# Usage:
#   Production:  docker-compose up -d                    (default - uses prod services)
#   Development: docker-compose --profile dev up          (uses dev services)
#
# Environment variables are loaded from config/.env
# Copy config/.env.example to config/.env and fill in your values

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: infra-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-infra_portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-network

  # Development Backend (with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: infra-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - BASE_BRANCH=${BASE_BRANCH}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-infra_portal}
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      # Exclude vendor directory to avoid vendoring conflicts
      - /app/vendor
    # Command runs go run . from the mounted volume
    # Use -mod=mod to ignore vendor directory if it exists
    command: sh -c "go mod download && go run -mod=mod ."
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  # Production Backend (compiled binary)
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infra-backend
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - BASE_BRANCH=${BASE_BRANCH}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-infra_portal}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  # Development Frontend (with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infra-frontend-dev
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.30.10.133:8080}
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # Override command to run dev server
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  # Production Frontend (built and optimized)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: infra-frontend
    ports:
      - "3000:3000"
    env_file:
      - config/.env 
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://34.30.10.133:8080}
    depends_on:
      backend-prod:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

volumes:
  postgres_data:

networks:
  infra-network:
    driver: bridge
