version: '3.8'

# InfraGate local stack
#
# Development:
#   make compose-dev
#
# Production-like:
#   make compose-prod
#
# Environment: config/.env (copy from config/.env.example)

services:
  redis:
    image: redis:7-alpine
    container_name: infra-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: infra-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - DB_CONN_MAX_LIFETIME_MINUTES=2
      - DB_CONN_MAX_IDLE_TIME_MINUTES=1
      - DB_MAX_OPEN_CONNS=15
      - DB_MAX_IDLE_CONNS=3
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_FRONTEND_URL=http://localhost:3001
      - DEVOPS_FRONTEND_URL=http://localhost:3002
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - REDIS_ADDR=redis:6379
      - REDIS_URL=
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_CACHE_TTL_SECONDS=${REDIS_CACHE_TTL_SECONDS:-90}
      - REDIS_QUEUE_NAME=${REDIS_QUEUE_NAME:-infra:jobs}
      - REDIS_JOB_POLL_TIMEOUT_SECONDS=${REDIS_JOB_POLL_TIMEOUT_SECONDS:-5}
      - DB_QUERY_TIMEOUT_SECONDS=${DB_QUERY_TIMEOUT_SECONDS:-5}
      - DB_TX_TIMEOUT_SECONDS=${DB_TX_TIMEOUT_SECONDS:-30}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-750}
      - REQUEST_LOG_SLOW_MS=${REQUEST_LOG_SLOW_MS:-500}
      - DB_SSLROOTCERT=/app/certs/prod-ca-2021.crt
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
      - /app/vendor
    command: sh -c "go mod download && go run -mod=mod ."
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  backend-prod:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: infra-backend
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      - DB_CONN_MAX_LIFETIME_MINUTES=2
      - DB_CONN_MAX_IDLE_TIME_MINUTES=1
      - DB_MAX_OPEN_CONNS=15
      - DB_MAX_IDLE_CONNS=3
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_FRONTEND_URL=http://localhost:3001
      - DEVOPS_FRONTEND_URL=http://localhost:3002
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - REDIS_ADDR=redis:6379
      - REDIS_URL=
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_CACHE_TTL_SECONDS=${REDIS_CACHE_TTL_SECONDS:-90}
      - REDIS_QUEUE_NAME=${REDIS_QUEUE_NAME:-infra:jobs}
      - REDIS_JOB_POLL_TIMEOUT_SECONDS=${REDIS_JOB_POLL_TIMEOUT_SECONDS:-5}
      - DB_QUERY_TIMEOUT_SECONDS=${DB_QUERY_TIMEOUT_SECONDS:-5}
      - DB_TX_TIMEOUT_SECONDS=${DB_TX_TIMEOUT_SECONDS:-30}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-750}
      - REQUEST_LOG_SLOW_MS=${REQUEST_LOG_SLOW_MS:-500}
      - DB_SSLROOTCERT=/app/certs/prod-ca-2021.crt
    volumes:
      - ./config:/app/config:ro
      - ./prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: infra-frontend-dev
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_IGNORE_INCORRECT_LOCKFILE=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - ./shared-ui:/shared-ui
      - ./shared-ui:/app/shared-ui
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install --no-package-lock && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: infra-frontend
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod
      - default

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: infra-admin-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  admin-frontend-prod:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: infra-admin-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend-prod
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod

  devops-frontend:
    build:
      context: .
      dockerfile: devops-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: infra-devops-frontend
    ports:
      - "3002:3002"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - dev

  devops-frontend-prod:
    build:
      context: .
      dockerfile: devops-frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    container_name: infra-devops-frontend
    ports:
      - "3002:3002"
    env_file:
      - config/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend-prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - infra-network
    profiles:
      - prod

volumes:
  redis_data:

networks:
  infra-network:
    driver: bridge
